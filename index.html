<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Soundboard | Interactive WebGL Experience</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <main class="ui-layer">
    <header class="header">
      <h1>COSMOS</h1>
      <p>Press any key (A–Z) or click/tap anywhere to trigger sound & visual shockwaves</p>
    </header>

    <div class="controls-panel">
      <button id="btn-theme" class="ctrl-btn">Cycle Theme</button>
      <button id="btn-warp" class="ctrl-btn">Toggle Warp Speed</button>
    </div>

    <div id="key-display" class="key-indicator">PRESS A KEY</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
