<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D CAD Viewer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="logo">
            3D CAD Viewer
        </div>

        <label class="file-button">
            📂 Open Model
            <input type="file"
                   id="fileInput"
                   accept=".stl,.obj">
        </label>

        <button onclick="fitModel()">Fit</button>

        <button onclick="resetView()">Reset</button>

        <button onclick="toggleWireframe()">
            Wireframe
        </button>

        <button onclick="toggleFullscreen()">
            Full Screen
        </button>

    </header>


    <!-- MAIN AREA -->
    <main class="main">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">

            <div class="section-title">
                MEASUREMENT
            </div>

            <button class="tool"
                    onclick="startMeasure()">
                📏 Measure Distance
            </button>

            <button class="tool"
                    onclick="clearMeasurement()">
                ❌ Clear Measurement
            </button>


            <div class="section-title">
                STANDARD VIEWS
            </div>

            <button class="tool"
                    onclick="setView('front')">
                Front
            </button>

            <button class="tool"
                    onclick="setView('back')">
                Back
            </button>

            <button class="tool"
                    onclick="setView('top')">
                Top
            </button>

            <button class="tool"
                    onclick="setView('bottom')">
                Bottom
            </button>

            <button class="tool"
                    onclick="setView('left')">
                Left
            </button>

            <button class="tool"
                    onclick="setView('right')">
                Right
            </button>

            <button class="tool"
                    onclick="setView('iso')">
                Isometric
            </button>

        </aside>


        <!-- VIEWER -->
        <section class="viewer">

            <div id="viewer"></div>


            <!-- MEASUREMENT PANEL -->
            <div id="measurePanel"
                 class="measure-panel">

                <h3>📏 Measurement</h3>

                <p>
                    Select two points on the model.
                </p>

                <div id="measureResult"
                     class="measure-result">
                    0.00 mm
                </div>

            </div>


            <!-- STATUS -->
            <div id="status"
                 class="status">
                Ready
            </div>

        </section>

    </main>


    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>


    <script type="module"
            src="script.js"></script>

</body>

</html>
